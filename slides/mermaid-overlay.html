<style>
#mermaid-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: rgba(0,0,0,0.9);
  z-index: 9999;
  overflow: hidden;
}
#mermaid-overlay .zoom-container {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  transform-origin: 0 0;
}
#mermaid-overlay svg {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  max-width: none;
  height: auto;
}
#mermaid-overlay .controls {
  position: fixed;
  top: 15px; right: 15px;
  z-index: 10000;
  display: flex;
  gap: 8px;
}
#mermaid-overlay .controls button {
  background: rgba(255,255,255,0.9);
  border: none;
  border-radius: 6px;
  width: 40px; height: 40px;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
#mermaid-overlay .controls button:hover {
  background: #fff;
}
.mermaid-js svg, .mermaid svg {
  cursor: pointer;
}
.diagram-scroll {
  overflow: auto;
  max-height: 75vh;
  border: 1px solid #ddd;
  border-radius: 6px;
  padding: 10px;
}
.diagram-scroll .cell-output-display,
.diagram-scroll .mermaid-js,
.diagram-scroll .mermaid {
  min-width: max-content;
}
</style>
<div id="mermaid-overlay"></div>
<script>
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    var overlay = document.getElementById('mermaid-overlay');
    var scale = 1, panX = 0, panY = 0;
    var isDragging = false, startX, startY;

    function openOverlay(svg) {
      scale = 1; panX = 0; panY = 0;
      overlay.innerHTML =
        '<div class="controls">' +
          '<button id="zm-in" title="Zoom in">+</button>' +
          '<button id="zm-out" title="Zoom out">&minus;</button>' +
          '<button id="zm-reset" title="Reset">&#8634;</button>' +
          '<button id="zm-close" title="Close (Esc)">&times;</button>' +
        '</div>' +
        '<div class="zoom-container"></div>';
      var container = overlay.querySelector('.zoom-container');
      var clone = svg.cloneNode(true);
      clone.style.cursor = 'grab';
      clone.removeAttribute('width');
      clone.removeAttribute('height');
      clone.style.minWidth = '80vw';
      container.appendChild(clone);
      overlay.style.display = 'block';
      applyTransform(container);

      overlay.querySelector('#zm-in').onclick = function(e) { e.stopPropagation(); scale *= 1.3; applyTransform(container); };
      overlay.querySelector('#zm-out').onclick = function(e) { e.stopPropagation(); scale /= 1.3; applyTransform(container); };
      overlay.querySelector('#zm-reset').onclick = function(e) { e.stopPropagation(); scale = 1; panX = 0; panY = 0; applyTransform(container); };
      overlay.querySelector('#zm-close').onclick = function() { overlay.style.display = 'none'; };

      container.addEventListener('mousedown', function(e) {
        isDragging = true; startX = e.clientX - panX; startY = e.clientY - panY;
        clone.style.cursor = 'grabbing';
        e.preventDefault();
      });
      document.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        panX = e.clientX - startX; panY = e.clientY - startY;
        applyTransform(container);
      });
      document.addEventListener('mouseup', function() {
        isDragging = false;
        if (clone) clone.style.cursor = 'grab';
      });
      overlay.addEventListener('wheel', function(e) {
        e.preventDefault();
        var delta = e.deltaY > 0 ? 0.9 : 1.1;
        scale *= delta;
        scale = Math.max(0.2, Math.min(scale, 10));
        applyTransform(container);
      }, {passive: false});
    }

    function applyTransform(container) {
      container.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + scale + ')';
    }

    document.querySelectorAll('.mermaid-js svg, .mermaid svg').forEach(function(svg) {
      svg.addEventListener('click', function(e) {
        e.stopPropagation();
        e.preventDefault();
        openOverlay(svg);
      });
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') overlay.style.display = 'none';
    });
  }, 2000);
});
</script>
