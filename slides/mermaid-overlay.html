<style>
#mermaid-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: rgba(0,0,0,0.9);
  z-index: 9999;
  overflow: hidden;
}
#mermaid-overlay .zoom-container {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  transform-origin: 0 0;
}
#mermaid-overlay svg {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  max-width: none;
  height: auto;
}
#mermaid-overlay .controls {
  position: fixed;
  top: 15px; right: 15px;
  z-index: 10000;
  display: flex;
  gap: 8px;
}
#mermaid-overlay .controls button {
  background: rgba(255,255,255,0.9);
  border: none;
  border-radius: 6px;
  width: 40px; height: 40px;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
#mermaid-overlay .controls button:hover {
  background: #fff;
}
.mermaid-js svg, .mermaid svg {
  cursor: pointer;
}
.diagram-scroll {
  overflow: auto;
  max-height: 75vh;
  border: 1px solid #ddd;
  border-radius: 6px;
  padding: 10px;
}
.diagram-scroll .cell-output-display,
.diagram-scroll .mermaid-js,
.diagram-scroll .mermaid {
  min-width: max-content;
}
</style>

<div id="mermaid-overlay"></div>

<script>
(function() {
  var SCALE_FACTOR = 0.55; // adjust this value to fit your slide

  function scaleSVG(svg) {
    if (svg.closest('#mermaid-overlay')) return;
    if (svg.dataset.scaled === 'true') return;
    // Check SVG has real dimensions set by mermaid
    var w = parseFloat(svg.getAttribute('width'));
    var h = parseFloat(svg.getAttribute('height'));
    if (!w || !h || w < 10 || h < 10) return;
    // Use viewBox from existing attributes rather than getBBox
    // to avoid layout-not-ready issues
    if (!svg.getAttribute('viewBox')) {
      svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    }
    svg.setAttribute('width',  w * SCALE_FACTOR);
    svg.setAttribute('height', h * SCALE_FACTOR);
    svg.dataset.scaled = 'true';

    // Attach click-to-overlay
    svg.addEventListener('click', function(e) {
      e.stopPropagation();
      e.preventDefault();
      openOverlay(svg);
    });
  }

  // Watch for mermaid SVGs being added or modified
  var observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
      mutation.addedNodes.forEach(function(node) {
        if (node.nodeType !== 1) return;
        // Direct SVG insertion
        if (node.tagName === 'svg') { scaleSVG(node); }
        // SVG inside added container
        node.querySelectorAll && node.querySelectorAll('svg').forEach(scaleSVG);
      });
      // Also catch attribute changes on existing SVGs (mermaid sets width/height late)
      if (mutation.type === 'attributes' && mutation.target.tagName === 'svg') {
        scaleSVG(mutation.target);
      }
    });
  });

  observer.observe(document.documentElement, {
    childList: true,
    subtree: true,
    attributes: true,
    attributeFilter: ['width', 'height']
  });

  // Overlay logic
  var overlay;
  var scale = 1, panX = 0, panY = 0;
  var isDragging = false, startX, startY;
  var currentClone = null;

  function openOverlay(svg) {
    scale = 1; panX = 0; panY = 0;
    overlay.innerHTML =
      '<div class="controls">' +
        '<button id="zm-in" title="Zoom in">+</button>' +
        '<button id="zm-out" title="Zoom out">&minus;</button>' +
        '<button id="zm-reset" title="Reset">&#8634;</button>' +
        '<button id="zm-close" title="Close (Esc)">&times;</button>' +
      '</div>' +
      '<div class="zoom-container"></div>';
    var container = overlay.querySelector('.zoom-container');
    currentClone = svg.cloneNode(true);
    currentClone.style.cursor = 'grab';
    currentClone.removeAttribute('width');
    currentClone.removeAttribute('height');
    currentClone.removeAttribute('data-scaled');
    currentClone.style.minWidth = '80vw';
    container.appendChild(currentClone);
    overlay.style
